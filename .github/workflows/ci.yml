name: Node.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: empmngsys
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Fix Binary Permissions
        run: chmod -R +x node_modules/.bin || true

      - name: Initialize Database
        env:
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: empmngsys
        run: |
          node -e "const { Pool } = require('pg'); const pool = new Pool({ user: process.env.DB_USER, password: process.env.DB_PASSWORD, host: process.env.DB_HOST, port: process.env.DB_PORT, database: process.env.DB_NAME }); pool.query('CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, name VARCHAR(100) NOT NULL, email VARCHAR(255) UNIQUE NOT NULL, password VARCHAR(255) NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);').then(() => { console.log('Database table ready'); return pool.end(); }).catch(err => { console.error(err); process.exit(1); });"

      - name: Run Tests
        env:
          DB_USER: postgres
          DB_PASSWORD: mysecretpassword
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: empmngsys
        run: node ./node_modules/jest/bin/jest.js --runInBand --detectOpenHandles